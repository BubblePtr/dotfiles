<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<fontconfig>
  <!-- 50-omarchy.conf 会先把 sans-serif assign 成 Liberation Sans,
       所以这里要匹配替换后的名字,再前插更纱黑体。
       结果:UI 西文 Iosevka + 中文思源黑体,与终端 Ioskeley 同族。 -->
  <match target="pattern">
    <test name="family"><string>Liberation Sans</string></test>
    <edit name="family" mode="prepend" binding="strong">
      <string>Sarasa Gothic SC</string>
    </edit>
  </match>
  <!-- 同理:等宽被 assign 成 JetBrainsMono Nerd Font,前插 Sarasa Mono -->
  <match target="pattern">
    <test name="family"><string>JetBrainsMono Nerd Font</string></test>
    <edit name="family" mode="prepend" binding="strong">
      <string>Sarasa Mono SC Nerd Font</string>
    </edit>
  </match>
</fontconfig>
